# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths:
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/static.yml"
  # Runs every day at 12:00 Asia/Shanghai.
  schedule:
    - cron: "0 4 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data index
        run: node scripts/build-data-index.mjs
      - name: Copy data into docs for Pages
        # GitHub Pages 只发布 docs/ 作为站点根目录，showcase.html 用相对路径
        # data/ 读取文章，因此部署前把 data/ 复制进 docs/data/，
        # 这样线上 /lucky-cat/data/... 才能正确加载（../data/ 在 Pages 下会 404）。
        run: rm -rf docs/data && cp -r data docs/data
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "./docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
