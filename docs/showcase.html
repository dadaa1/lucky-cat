<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容展示</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --panel: #fffdfa;
        --panel-strong: #fff8ed;
        --ink: #22201d;
        --muted: #746d63;
        --line: #e4dacf;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --gold: #c17b24;
        --rose: #b94b5b;
        --shadow: 0 18px 48px rgba(61, 45, 26, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(15, 118, 110, 0.1), transparent 360px),
          var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .topbar {
        height: 69px;
        z-index: 20;
        border-bottom: 1px solid rgba(228, 218, 207, 0.8);
        background: rgba(255, 253, 250, 0.92);
        backdrop-filter: blur(18px);
      }

      .topbar-inner {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(240px, 420px) auto;
        gap: 16px;
        align-items: center;
        max-width: 1280px;
        margin: 0 auto;
        padding: 14px 22px;
      }

      .brand {
        min-width: 0;
      }

      .brand-title {
        margin: 0;
        font-size: 21px;
        letter-spacing: 0;
      }

      .brand-subtitle {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .search {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 10px 12px;
        color: var(--ink);
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .select,
      .icon-button {
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      .select {
        padding: 0 10px;
      }

      .icon-button {
        width: 40px;
        display: inline-grid;
        place-items: center;
        cursor: pointer;
      }

      .layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        gap: 24px;
        height: calc(100vh - 69px);
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 22px;
        overflow: hidden;
      }

      .sidebar,
      .reader {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-bottom: 20px;
        scrollbar-gutter: stable;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }

      .stat strong {
        display: block;
        color: var(--accent-dark);
        font-size: 22px;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .card {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px;
        text-align: left;
        color: inherit;
        cursor: pointer;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
      }

      .card:hover,
      .card.active {
        border-color: rgba(15, 118, 110, 0.45);
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.12);
      }

      .thumb {
        width: 88px;
        aspect-ratio: 4 / 3;
        border-radius: 6px;
        background: linear-gradient(135deg, #e8ddd1, #d5ece8);
        object-fit: cover;
      }

      .card-title {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.45;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .card-summary {
        display: -webkit-box;
        margin: 6px 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-strong);
        padding: 2px 7px;
      }

      .reader-shell {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .hero {
        position: relative;
        min-height: 310px;
        display: grid;
        align-items: end;
        padding: 28px;
        background: #d9e9e6;
        overflow: hidden;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 15%, rgba(18, 16, 13, 0.72));
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 820px;
        color: #fff;
      }

      .hero h2 {
        margin: 0;
        font-size: 34px;
        line-height: 1.24;
        letter-spacing: 0;
      }

      .hero a {
        color: #fff;
      }

      .reader-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        gap: 28px;
        padding: 28px;
      }

      .article {
        min-width: 0;
        color: #2e2a26;
        font-size: 16px;
        line-height: 1.86;
      }

      .article h1,
      .article h2,
      .article h3 {
        margin: 26px 0 12px;
        line-height: 1.35;
      }

      .article p {
        margin: 0 0 15px;
      }

      .article img {
        display: block;
        max-width: 100%;
        max-height: 70vh;
        margin: 18px auto;
        border-radius: 8px;
        border: 1px solid var(--line);
      }

      .comments-section {
        border-top: 1px solid var(--line);
        background: #fbf7f1;
        padding: 28px;
      }

      .comments-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .comments-head h3 {
        margin: 0;
        font-size: 20px;
      }

      .comment-tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .comment-list {
        display: grid;
        gap: 12px;
      }

      .load-comments {
        width: 100%;
        height: 42px;
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--accent-dark);
        cursor: pointer;
        font-weight: 700;
      }

      .comment {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 14px;
      }

      .comment.reply {
        margin-top: 10px;
        margin-left: 34px;
        background: #fffaf4;
      }

      .comment-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .comment-author {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }

      .comment-content {
        color: #2d2924;
        font-size: 14px;
        line-height: 1.75;
        word-break: break-word;
      }

      .comment-content p {
        margin: 0 0 8px;
      }

      .comment-content img {
        display: block;
        max-width: min(360px, 100%);
        max-height: 360px;
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: contain;
      }

      .article a {
        color: var(--accent-dark);
      }

      .media-links {
        display: grid;
        gap: 8px;
        margin: 18px 0;
      }

      .media-link {
        display: inline-flex;
        width: fit-content;
        max-width: 100%;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(15, 118, 110, 0.28);
        border-radius: 8px;
        background: #eef8f6;
        padding: 8px 11px;
        color: var(--accent-dark);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.45;
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      .article blockquote {
        margin: 18px 0;
        border-left: 4px solid var(--accent);
        padding: 4px 0 4px 16px;
        color: var(--muted);
      }

      .side-panel {
        position: sticky;
        top: 18px;
        align-self: start;
        border-left: 1px solid var(--line);
        padding-left: 18px;
      }

      .back-top {
        position: fixed;
        right: max(22px, calc((100vw - 1280px) / 2 + 22px));
        bottom: 24px;
        z-index: 30;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(15, 118, 110, 0.28);
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(15, 118, 110, 0.22);
        font-size: 18px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }

      .back-top.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .side-panel h3 {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .gallery img {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 6px;
        object-fit: cover;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.55);
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 960px) {
        .topbar-inner,
        .layout,
        .reader-body {
          grid-template-columns: 1fr;
        }

        body {
          height: auto;
          overflow: auto;
        }

        .topbar {
          position: sticky;
          top: 0;
          height: auto;
        }

        .layout {
          height: auto;
          overflow: visible;
        }

        .sidebar,
        .reader {
          overflow: visible;
          padding-bottom: 0;
        }

        .controls {
          justify-content: space-between;
        }

        .side-panel {
          position: static;
          border-left: 0;
          border-top: 1px solid var(--line);
          padding: 18px 0 0;
        }
      }

      @media (max-width: 560px) {
        .topbar-inner,
        .layout {
          padding-left: 14px;
          padding-right: 14px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .card {
          grid-template-columns: 72px minmax(0, 1fr);
        }

        .thumb {
          width: 72px;
        }

        .hero {
          min-height: 240px;
          padding: 20px;
        }

        .hero h2 {
          font-size: 24px;
        }

        .reader-body {
          padding: 20px;
        }

        .comments-section {
          padding: 20px;
        }

        .comment.reply {
          margin-left: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1 class="brand-title">内容展示</h1>
          <p class="brand-subtitle">来自 data 目录的本地文章库</p>
        </div>
        <input id="search" class="search" type="search" placeholder="搜索标题、作者、摘要" />
        <div class="controls">
          <select id="sort" class="select" aria-label="排序">
            <option value="new">最新优先</option>
            <option value="images">图片最多</option>
            <option value="title">标题排序</option>
          </select>
          <button id="theme" class="icon-button" type="button" title="切换密度">≡</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="stats" aria-label="统计">
          <div class="stat"><strong id="totalCount">0</strong><span>篇内容</span></div>
          <div class="stat"><strong id="imageCount">0</strong><span>张图片</span></div>
          <div class="stat"><strong id="matchCount">0</strong><span>当前匹配</span></div>
        </section>
        <section id="list" class="list" aria-label="文章列表"></section>
      </aside>

      <section class="reader">
        <article id="reader" class="reader-shell">
          <div class="empty">正在读取内容...</div>
        </article>
      </section>
    </main>
    <button id="backTop" class="back-top" type="button" title="回到顶部" aria-label="回到顶部">↑</button>

    <script>
      const state = {
        records: [],
        filtered: [],
        selected: null,
        hiddenComments: [],
        dense: false,
      };

      const dataRoot = '../data/';
      const $ = (selector) => document.querySelector(selector);
      const scrollTarget = () => (window.matchMedia('(max-width: 960px)').matches ? document.scrollingElement : $('.reader'));

      const formatDate = (record) => {
        if (record.createDate) return record.createDate;
        if (record.updateDate) return new Date(record.updateDate).toLocaleDateString('zh-CN');
        return '未标注日期';
      };

      const itemUrl = (record, file = '') =>
        `${dataRoot}${encodeURIComponent(record.folder).replaceAll('%2F', '/')}/${file
          .split('/')
          .map(encodeURIComponent)
          .join('/')}`;

      const escapeHtml = (text = '') =>
        text.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);

      const normalizeInlineHtml = (text = '') =>
        text
          .replace(/<a\s+[^>]*href=(["'])(.*?)\1[^>]*>([\s\S]*?)<\/a>/gi, (_, __, href, label) => {
            const cleanLabel = label.replace(/<[^>]+>/g, '').trim();
            return cleanLabel ? `[${cleanLabel}](${href})` : '';
          })
          .replace(/<br\s*\/?>/gi, ' ')
          .replace(/<\/p>\s*<p>/gi, ' ')
          .replace(/<\/?[^>]+>/g, '');

      const inlineMarkdown = (text, record) =>
        escapeHtml(normalizeInlineHtml(text))
          .replace(/!\[([^\]]*)]\(([^)]+)\)/g, (_, alt, src) => {
            const imageSrc = src.startsWith('http') ? src : itemUrl(record, src);
            return `<img src="${imageSrc}" alt="${alt}" loading="lazy" />`;
          })
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\[([^\]]+)]\(([^)]+\.(?:jpg|jpeg|png|webp|gif)(?:\?[^)]*)?)\)/gi, '<img src="$2" alt="$1" loading="lazy" />')
          .replace(/\[([^\]]+)]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');

      const renderMediaLine = (line) => {
        const links = [];
        const withoutVideos = line.replace(/%\[[^\]]*]\(([^)]+)\)/g, (_, href) => {
          links.push({ href, label: '知乎视频' });
          return ' ';
        });
        const withoutMarkdownLinks = withoutVideos.replace(/\[([^\]]+)]\(([^)]+)\)/g, (_, label, href) => {
          links.push({ href, label: label || href });
          return ' ';
        });
        const bareText = withoutMarkdownLinks.trim();

        if (!links.length || bareText) return '';
        return `<div class="media-links">${links
          .map(
            (link) =>
              `<a class="media-link" href="${escapeHtml(link.href)}" target="_blank" rel="noreferrer">${escapeHtml(link.label)}</a>`,
          )
          .join('')}</div>`;
      };

      const renderMarkdown = (markdown, record) => {
        const body = markdown
          .replace(/^---[\s\S]*?---/, '')
          .replace(/\n# 评论[\s\S]*$/m, '')
          .replace(/\[toc\]/gi, '');
        const lines = body.split(/\r?\n/);
        const html = [];
        let paragraph = [];
        let list = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          html.push(`<p>${inlineMarkdown(paragraph.join(' '), record)}</p>`);
          paragraph = [];
        };
        const flushList = () => {
          if (!list.length) return;
          html.push(`<ol>${list.map((item) => `<li>${inlineMarkdown(item, record)}</li>`).join('')}</ol>`);
          list = [];
        };

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) {
            flushParagraph();
            flushList();
            continue;
          }

          const mediaLine = renderMediaLine(line);
          if (mediaLine) {
            flushParagraph();
            flushList();
            html.push(mediaLine);
            continue;
          }

          const image = line.match(/^!\[([^\]]*)]\(([^)]+)\)$/);
          if (image) {
            flushParagraph();
            flushList();
            const src = image[2].startsWith('http') ? image[2] : itemUrl(record, image[2]);
            html.push(`<img src="${src}" alt="${escapeHtml(image[1])}" loading="lazy" />`);
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            flushList();
            html.push(`<h${heading[1].length}>${inlineMarkdown(heading[2], record)}</h${heading[1].length}>`);
            continue;
          }

          const ordered = line.match(/^\d+\.\s+(.+)$/);
          if (ordered) {
            flushParagraph();
            list.push(ordered[1]);
            continue;
          }

          if (/^_{3,}$/.test(line) || /^-{3,}$/.test(line)) {
            flushParagraph();
            flushList();
            html.push('<hr />');
            continue;
          }

          paragraph.push(line);
        }

        flushParagraph();
        flushList();
        return html.join('');
      };

      const sortRecords = (records) => {
        const mode = $('#sort').value;
        return [...records].sort((a, b) => {
          if (mode === 'images') return b.imageCount - a.imageCount;
          if (mode === 'title') return a.title.localeCompare(b.title, 'zh-Hans-CN');
          return String(b.updateDate || b.createDate).localeCompare(String(a.updateDate || a.createDate));
        });
      };

      const applyFilters = () => {
        const query = $('#search').value.trim().toLowerCase();
        const matched = state.records.filter((record) => {
          const haystack = [record.title, record.author, record.summary, record.category].join(' ').toLowerCase();
          return !query || haystack.includes(query);
        });
        state.filtered = sortRecords(matched);
        renderList();
      };

      const renderStats = () => {
        $('#totalCount').textContent = state.records.length;
        $('#imageCount').textContent = state.records.reduce((sum, record) => sum + record.imageCount, 0);
        $('#matchCount').textContent = state.filtered.length;
      };

      const commentTime = (value) => {
        if (!value) return '';
        return new Date(value * 1000).toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        });
      };

      const normalizeCommentHtml = (html = '', record) => {
        const template = document.createElement('template');
        template.innerHTML = html || '';
        template.content.querySelectorAll('a.comment_img').forEach((link) => {
          const href = link.getAttribute('href') || '';
          const file = record.images.find((image) => href.includes(image.split('/').pop().replace(/\.(jpg|jpeg|png|webp)$/i, '')));
          const img = document.createElement('img');
          img.alt = '评论图片';
          img.loading = 'lazy';
          if (file) {
            img.src = itemUrl(record, file);
          } else {
            img.src = href;
          }
          link.replaceWith(img);
        });
        template.content.querySelectorAll('a').forEach((link) => {
          const href = link.getAttribute('href') || '';
          if (!/\.(jpg|jpeg|png|webp|gif)(\?|#|$)/i.test(href)) return;
          const img = document.createElement('img');
          img.src = href;
          img.alt = link.textContent.trim() || '评论图片';
          img.loading = 'lazy';
          link.replaceWith(img);
        });
        template.content.querySelectorAll('a').forEach((link) => {
          link.target = '_blank';
          link.rel = 'noreferrer';
        });
        return template.innerHTML || escapeHtml(html);
      };

      const commentLocation = (comment) =>
        comment.comment_tag?.find((tag) => tag.type === 'ip_info')?.text || '';

      const renderComment = (comment, record, isReply = false) => {
        const content = comment.content?.includes('<')
          ? normalizeCommentHtml(comment.content, record)
          : inlineMarkdown(comment.markdown || comment.content || '', record);
        const replies = (comment.child_comments || [])
          .map((reply) => renderComment(reply, record, true))
          .join('');
        const replyTo = comment.reply_to_author?.name ? ` 回复 ${escapeHtml(comment.reply_to_author.name)}` : '';

        return `
          <article class="comment ${isReply ? 'reply' : ''}">
            <div class="comment-meta">
              <span class="comment-author">${escapeHtml(comment.author?.name || '匿名用户')}${replyTo}</span>
              ${commentLocation(comment) ? `<span>${escapeHtml(commentLocation(comment))}</span>` : ''}
              ${comment.created_time ? `<span>${commentTime(comment.created_time)}</span>` : ''}
              <span>${comment.like_count || 0} 赞</span>
            </div>
            <div class="comment-content">${content}</div>
            ${replies}
          </article>`;
      };

      const loadComments = async (record) => {
        state.hiddenComments = [];
        if (!record.commentsPath) return '';
        try {
          const response = await fetch(itemUrl(record, record.commentsPath));
          const comments = await response.json();
          if (!comments.length) return '';
          const visibleComments = comments.slice(0, 30);
          state.hiddenComments = comments.slice(30);
          const hiddenCount = state.hiddenComments.length;
          return `
            <section class="comments-section">
              <div class="comments-head">
                <h3>评论</h3>
                <div class="comment-tools">
                  <span class="pill">${record.commentCount || comments.length} 条</span>
                  <span class="pill">${comments.length} 组讨论</span>
                </div>
              </div>
              <div class="comment-list">
                ${visibleComments.map((comment) => renderComment(comment, record)).join('')}
              </div>
              ${
                hiddenCount
                  ? `<button class="load-comments" type="button">展开剩余 ${hiddenCount} 组讨论</button>`
                  : ''
              }
            </section>`;
        } catch {
          return `
            <section class="comments-section">
              <div class="empty">评论读取失败</div>
            </section>`;
        }
      };

      const renderList = () => {
        renderStats();
        const list = $('#list');
        if (!state.filtered.length) {
          list.innerHTML = '<div class="empty">没有匹配的内容</div>';
          return;
        }

        list.innerHTML = state.filtered
          .map((record) => {
            const cover = record.cover ? `<img class="thumb" src="${itemUrl(record, record.cover)}" alt="" loading="lazy" />` : '<div class="thumb"></div>';
            return `
              <button class="card ${state.selected?.id === record.id ? 'active' : ''}" type="button" data-id="${record.id}">
                ${cover}
                <span>
                  <span class="card-title">${escapeHtml(record.title)}</span>
                  <span class="card-summary">${escapeHtml(record.summary || '暂无摘要')}</span>
                  <span class="meta">
                    <span class="pill">${escapeHtml(record.author || '未标注作者')}</span>
                    <span>${record.imageCount} 图</span>
                    ${record.commentCount ? `<span>${record.commentCount} 评</span>` : ''}
                  </span>
                </span>
              </button>`;
          })
          .join('');

        list.querySelectorAll('.card').forEach((button) => {
          button.addEventListener('click', () => selectRecord(button.dataset.id));
        });
      };

      const selectRecord = async (id) => {
        const record = state.records.find((item) => item.id === id) || state.filtered[0];
        if (!record) return;
        state.selected = record;
        renderList();

        const reader = $('#reader');
        reader.innerHTML = '<div class="empty">正在打开文章...</div>';

        try {
          const response = await fetch(itemUrl(record, record.markdown));
          const markdown = await response.text();
          const commentsHtml = await loadComments(record);
          const cover = record.cover ? `<img src="${itemUrl(record, record.cover)}" alt="" />` : '';
          const gallery = record.images
            .slice(0, 10)
            .map((image) => `<img src="${itemUrl(record, image)}" alt="" loading="lazy" />`)
            .join('');

          reader.innerHTML = `
            <header class="hero">
              ${cover}
              <div class="hero-content">
                <p class="meta">
                  <span class="pill">${escapeHtml(record.author || '本地内容')}</span>
                  <span>${escapeHtml(formatDate(record))}</span>
                  <span>${record.imageCount} 张图片</span>
                </p>
                <h2>${escapeHtml(record.title)}</h2>
                ${record.slug ? `<p><a href="${record.slug}" target="_blank" rel="noreferrer">查看原文</a></p>` : ''}
              </div>
            </header>
            <div class="reader-body">
              <div class="article">${renderMarkdown(markdown, record)}</div>
              <aside class="side-panel">
                <h3>图片速览</h3>
                <div class="gallery">${gallery || '<div class="empty">没有图片</div>'}</div>
              </aside>
            </div>
            ${commentsHtml}`;
          scrollTarget()?.scrollTo({ top: 0, behavior: 'auto' });

          reader.querySelector('.load-comments')?.addEventListener('click', (event) => {
            const button = event.currentTarget;
            button.previousElementSibling.insertAdjacentHTML(
              'beforeend',
              state.hiddenComments.map((comment) => renderComment(comment, record)).join(''),
            );
            state.hiddenComments = [];
            button.remove();
          });

          history.replaceState(null, '', `#${record.id}`);
        } catch (error) {
          reader.innerHTML = `<div class="empty">文章读取失败：${escapeHtml(error.message)}</div>`;
        }
      };

      const init = async () => {
        const response = await fetch('data-index.json');
        state.records = await response.json();
        state.filtered = sortRecords(state.records);
        const backTop = $('#backTop');
        const updateBackTop = () => {
          const target = scrollTarget();
          backTop.classList.toggle('visible', (target?.scrollTop || 0) > 420);
        };

        $('#search').addEventListener('input', applyFilters);
        $('#sort').addEventListener('change', applyFilters);
        $('#theme').addEventListener('click', () => {
          state.dense = !state.dense;
          document.body.style.setProperty('--bg', state.dense ? '#f2f5f4' : '#f6f3ee');
        });
        $('.reader').addEventListener('scroll', updateBackTop, { passive: true });
        window.addEventListener('scroll', updateBackTop, { passive: true });
        window.addEventListener('resize', updateBackTop);
        backTop.addEventListener('click', () => {
          scrollTarget()?.scrollTo({ top: 0, behavior: 'smooth' });
        });

        renderList();
        const hashId = decodeURIComponent(location.hash.slice(1));
        selectRecord(hashId || state.filtered[0]?.id);
      };

      init().catch((error) => {
        $('#reader').innerHTML = `<div class="empty">数据索引读取失败：${escapeHtml(error.message)}</div>`;
      });
    </script>
  </body>
</html>
